# cargo-audit configuration (https://docs.rs/cargo-audit)
# Read automatically by `cargo audit` from `.cargo/audit.toml`.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa "Marvin Attack" timing sidechannel): no fixed
    # version is available upstream. `rsa` is reachable through jsonwebtoken's
    # rust_crypto backend (and appears through sqlx's disabled MySQL feature),
    # but this application issues and validates JWTs with HS256 only. No RSA
    # operation is reachable in the configured authentication paths.
    # RE-EVALUATE if an RS* JWT algorithm or sqlx's `mysql` feature is enabled.
    "RUSTSEC-2023-0071",
]
