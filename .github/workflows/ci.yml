name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Default the workflow token to read-only. The image publishing job grants the
# one additional permission it needs locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Minimum coverage threshold (percentage). This is a RATCHET, not a goal:
  # measured unit-test line coverage was 29% the first time this gate ever
  # ran (2026-08-31; the previous value of 70 was aspirational and had never
  # been evaluated because CI had never reached it). Set just below the
  # measured baseline so the gate enforces "never lower", and raise it as
  # real coverage grows. Do not raise it above a number CI has measured.
  COVERAGE_THRESHOLD: 28
  # Core feature set: `full` minus `stark`, so lint/test/coverage build the
  # whole sequencer except the STARK proof verifier (whose crates live in the
  # private stateset-stark workspace). See the `stark` feature in Cargo.toml.
  # `integration` is appended per-step on the jobs that run database tests.
  CORE_FEATURES: pqc
  # Exact stateset-stark commit this repo's Cargo.lock was resolved against.
  # The ves-stark-* crates are path dependencies on a separate repo, so
  # tracking its default branch meant every upstream commit silently
  # invalidated Cargo.lock and failed every `--locked` job in this file.
  # Bump this ref and re-resolve the ves-stark-* crates with `cargo update`
  # in the same commit, so a STARK upgrade is always deliberate and atomic.
  STARK_REF: "c2cd52c6511279c9c73ab6eb16c5389176f95752"
  # Token with read access to the private stateset-stark repo. Add it under
  # Settings → Secrets and variables → Actions. Required because the ves-stark-*
  # crates are path dependencies that cargo must resolve even when the `stark`
  # feature is off.
  STARK_REPO_TOKEN: ${{ secrets.STARK_REPO_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: Validate deployment manifests
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          chart_version=$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' charts/stateset-sequencer/Chart.yaml)
          test "$crate_version" = "$chart_version"
          grep -q "app.kubernetes.io/version: \"$crate_version\"" k8s/deployment.yaml
          helm lint charts/stateset-sequencer
          helm lint charts/stateset-sequencer \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set anchoring.enabled=true \
            --set settlement.enabled=true \
            --set initContainer.enabled=true \
            --set initContainer.databaseHost=postgres \
            --set config.trustProxyHeaders=true \
            --set config.trustProxyAllowlist=10.42.1.0/24
          helm template sequencer charts/stateset-sequencer >/dev/null
          kubectl kustomize k8s >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --no-default-features --features "$CORE_FEATURES,integration" --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES" --lib --bins

      - name: Run integration tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,integration" --tests -- --include-ignored

      - name: Run property tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES" --test property_test

  test-stark:
    name: Test (stark feature)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The VES proof handlers and the verifier-side amount-binding enforcement are
      # all #[cfg(feature = "stark")] and are otherwise built/tested by no CI job.
      - name: Clippy (stark)
        run: cargo clippy --locked --no-default-features --features "$CORE_FEATURES,stark,integration" --all-targets -- -D warnings

      - name: Unit tests (stark)
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,stark" --lib --bins

      - name: Integration tests (stark)
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,stark,integration" --tests -- --include-ignored

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage (unit tests)
        run: |
          cargo tarpaulin \
            --no-default-features --features "$CORE_FEATURES" \
            --out Json \
            --out Xml \
            --output-dir coverage \
            --skip-clean \
            --exclude-files "target/*" \
            --exclude-files "tests/*" \
            --exclude-files "benches/*" \
            --exclude-files "src/proto/*" \
            --timeout 300

      - name: Generate coverage (integration tests)
        run: |
          cargo tarpaulin \
            --no-default-features --features "$CORE_FEATURES,integration" \
            --out Json \
            --out Xml \
            --output-dir coverage-integration \
            --skip-clean \
            --exclude-files "target/*" \
            --exclude-files "tests/*" \
            --exclude-files "benches/*" \
            --exclude-files "src/proto/*" \
            --timeout 600 \
            -- --ignored

      - name: Check coverage threshold
        run: |
          if [ -f coverage/tarpaulin-report.json ]; then
            COVERAGE=$(jq -r '.coverage' coverage/tarpaulin-report.json | cut -d'.' -f1)
            echo "Coverage: ${COVERAGE}%"
            echo "Threshold: ${COVERAGE_THRESHOLD}%"

            if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
              echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            fi

            echo "::notice::Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          else
            echo "::error::Coverage report not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-integration/
          retention-days: 7

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch local STARK dependency source
        run: |
          if [ ! -d ../stateset-stark ]; then
            git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$v" || { echo "::error::Cargo.toml has no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # The advertised minimum must actually build the advertised default
      # feature set. Anything less is a number in a README, not an MSRV.
      - name: Build on the minimum supported toolchain
        run: cargo check --locked --all-targets

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check bans
        run: cargo deny check bans

      - name: Check advisories
        run: cargo deny check advisories

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --no-run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch local STARK dependency source
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stateset-sequencer
          path: target/release/stateset-sequencer
          if-no-files-found: error

  # Docker image build and push
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    # Never publish an image from a revision that has only passed a subset of
    # the required checks. `all-checks` includes both feature sets, MSRV,
    # coverage, supply-chain checks, and the release build.
    needs: [all-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Ensure local STARK dependency source for Docker build
        run: |
          # The GitHub repo is stateset-starks (with an s) and is public, so no
          # token is needed; STARK_REPO_TOKEN is honoured if ever set (e.g. if
          # the repo is made private). Every CI run in this repository's
          # history had failed here: the secret was never configured AND the
          # URL pointed at stateset-stark.git, which does not exist.
          if [ ! -d ../stateset-stark ]; then
            if [ -n "$STARK_REPO_TOKEN" ]; then
              git clone --filter=blob:none --no-checkout "https://x-access-token:${STARK_REPO_TOKEN}@github.com/stateset/stateset-starks.git" ../stateset-stark
            else
              git clone --filter=blob:none --no-checkout "https://github.com/stateset/stateset-starks.git" ../stateset-stark
            fi
          fi
          git -C ../stateset-stark fetch --depth 1 origin "$STARK_REF"
          git -C ../stateset-stark checkout --detach "$STARK_REF"
          echo "stateset-stark pinned at $(git -C ../stateset-stark rev-parse HEAD)"

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}

      # The Dockerfile expects a parent directory containing both checkouts
      # (COPY stateset-sequencer/... and COPY stateset-stark). Stage that
      # layout explicitly inside the workspace: the action resolved the
      # previous `context: ..` inconsistently and failed with
      # "lstat stateset-sequencer: no such file or directory".
      - name: Stage Docker build context
        run: |
          mkdir -p docker-ctx/stateset-sequencer
          rsync -a --exclude target --exclude .git --exclude docker-ctx ./ docker-ctx/stateset-sequencer/
          rsync -a --exclude .git ../stateset-stark/ docker-ctx/stateset-stark/

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker-ctx
          file: docker-ctx/stateset-sequencer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # All checks must pass
  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, test, test-stark, msrv, coverage, security, license-check, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test failed"
            exit 1
          fi
          if [[ "${{ needs.test-stark.result }}" != "success" ]]; then
            echo "Test (stark feature) failed"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "MSRV build failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security audit failed"
            exit 1
          fi
          if [[ "${{ needs.license-check.result }}" != "success" ]]; then
            echo "License check failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed"
            exit 1
          fi
          echo "All checks passed!"
