name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Default the workflow token to read-only. The image publishing job grants the
# one additional permission it needs locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Minimum coverage threshold (percentage). This is a RATCHET, not a goal:
  # measured unit-test line coverage was 29% the first time this gate ever
  # ran (2026-08-31; the previous value of 70 was aspirational and had never
  # been evaluated because CI had never reached it). Set just below the
  # measured baseline so the gate enforces "never lower", and raise it as
  # real coverage grows. Do not raise it above a number CI has measured.
  COVERAGE_THRESHOLD: 28
  # Core feature set: `full` minus `stark`, so lint/test/coverage build the
  # whole sequencer except the STARK proof verifier (whose crates live in the
  # separate stateset-starks repo). See the `stark` feature in Cargo.toml.
  # `integration` is appended per-step on the jobs that run database tests.
  CORE_FEATURES: pqc
  # Exact stateset-starks commit the ves-stark-* git dependencies in
  # Cargo.toml are pinned to. Tracking its default branch would mean every
  # upstream commit silently invalidated Cargo.lock and failed every
  # `--locked` job in this file. Bump this ref, the `rev` pins in Cargo.toml
  # and Cargo.lock together (see "Upgrading the STARK dependency" in the
  # README), so a STARK upgrade is always deliberate and atomic.
  # `tests/source_invariants_test.rs` asserts the pins match this ref.
  STARK_REF: "4209d2623750242d680abc21d13f39ab80791c2b"

jobs:
  formal:
    name: Formal models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check TLA+ models
        working-directory: formal/tla
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar' | sha256sum --check
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SequencerIngest.cfg SequencerIngest.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SequencerTransactions.cfg SequencerTransactions.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SequencerReservations.cfg SequencerReservations.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config VesReplay.cfg VesReplay.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config VesBatchReservation.cfg VesBatchReservation.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config EntityVersions.cfg EntityVersions.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CommandLockOrder.cfg CommandLockOrder.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CommandReservationRace.cfg CommandReservationRace.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config IngestSqlRefinement.cfg IngestSqlRefinement.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SyncAndProjection.cfg SyncAndProjection.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CommitmentChain.cfg CommitmentChain.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config LeaderFinality.cfg LeaderFinality.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config X402Settlement.cfg X402Settlement.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config AuthorizationIsolation.cfg AuthorizationIsolation.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CrashRecovery.cfg CrashRecovery.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config KeyLifecycle.cfg KeyLifecycle.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config MigrationPreservation.cfg MigrationPreservation.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ChainReconciliation.cfg ChainReconciliation.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SharedRateLimits.cfg SharedRateLimits.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SchemaPolicy.cfg SchemaPolicy.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config EncryptedPayloadLifecycle.cfg EncryptedPayloadLifecycle.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config AuditIntegrity.cfg AuditIntegrity.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config StarkAdmission.cfg StarkAdmission.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config AuditTransactions.cfg AuditTransactions.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ProofJobLifecycle.cfg ProofJobLifecycle.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config DeadLetterClaims.cfg DeadLetterClaims.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config AtRestKeyRotation.cfg AtRestKeyRotation.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ExternalEffectFencing.cfg ExternalEffectFencing.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CacheReorgSafety.cfg CacheReorgSafety.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ProjectionDiscovery.cfg ProjectionDiscovery.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ProjectionReplay.cfg ProjectionReplay.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config NonceRetention.cfg NonceRetention.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config RollingKeyUpgrade.cfg RollingKeyUpgrade.tla
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ContractIdempotency.cfg ContractIdempotency.tla

  node-sdk:
    name: Node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Validate publication manifest
        run: |
          npm pkg fix
          git diff --exit-code -- package.json package-lock.json
          npm publish --dry-run

  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - name: Audit Python dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Verify distribution metadata
        run: |
          python -m build
          python -m twine check dist/*

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5

      - name: Validate deployment manifests
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          chart_version=$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' charts/stateset-sequencer/Chart.yaml)
          test "$crate_version" = "$chart_version"
          grep -q "app.kubernetes.io/version: \"$crate_version\"" k8s/deployment.yaml
          helm lint charts/stateset-sequencer
          helm lint charts/stateset-sequencer \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set anchoring.enabled=true \
            --set settlement.enabled=true \
            --set initContainer.enabled=true \
            --set initContainer.databaseHost=postgres \
            --set config.trustProxyHeaders=true \
            --set config.trustProxyAllowlist=10.42.1.0/24
          helm template sequencer charts/stateset-sequencer >/dev/null
          kubectl kustomize k8s >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --no-default-features --features "$CORE_FEATURES,integration" --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES" --lib --bins

      - name: Run integration tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,integration" --tests -- --include-ignored --test-threads=1

      - name: Run property tests
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES" --test property_test

      - name: Verify crash and logical-backup recovery
        run: bash scripts/run_recovery_drill.sh

      - name: Upload recovery drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-drill-evidence
          path: /tmp/sequencer-recovery.*/
          if-no-files-found: ignore
          retention-days: 7

  test-stark:
    name: Test (stark feature)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The VES proof handlers and the verifier-side amount-binding enforcement are
      # all #[cfg(feature = "stark")] and are otherwise built/tested by no CI job.
      - name: Clippy (stark)
        run: cargo clippy --locked --no-default-features --features "$CORE_FEATURES,stark,integration" --all-targets -- -D warnings

      - name: Unit tests (stark)
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,stark" --lib --bins

      - name: Integration tests (stark)
        run: cargo test --locked --no-default-features --features "$CORE_FEATURES,stark,integration" --tests -- --include-ignored --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://sequencer:sequencer@localhost:5432/stateset_sequencer
      # Turn a missing/unreachable database into a red build instead of a
      # silent skip: database-backed tests must never pass by not running.
      SEQUENCER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        # Keep the coverage engine reproducible: changes in instrumentation or
        # target discovery must be reviewed explicitly alongside the ratchet.
        run: cargo install cargo-tarpaulin --version 0.37.2 --locked

      - name: Generate coverage (unit tests)
        run: |
          cargo tarpaulin \
            --no-default-features --features "$CORE_FEATURES" \
            --out Json \
            --out Xml \
            --output-dir coverage \
            --skip-clean \
            --exclude-files "target/*" \
            --exclude-files "tests/*" \
            --exclude-files "benches/*" \
            --exclude-files "src/proto/*" \
            --timeout 300

      - name: Generate coverage (integration tests)
        run: |
          cargo tarpaulin \
            --no-default-features --features "$CORE_FEATURES,integration" \
            --out Json \
            --out Xml \
            --output-dir coverage-integration \
            --skip-clean \
            --exclude-files "target/*" \
            --exclude-files "tests/*" \
            --exclude-files "benches/*" \
            --exclude-files "src/proto/*" \
            --timeout 600 \
            -- --ignored --test-threads=1

      - name: Check coverage threshold
        run: |
          if [ -f coverage/tarpaulin-report.json ]; then
            COVERAGE=$(jq -r '.coverage' coverage/tarpaulin-report.json | cut -d'.' -f1)
            echo "Coverage: ${COVERAGE}%"
            echo "Threshold: ${COVERAGE_THRESHOLD}%"

            if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
              echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            fi

            echo "::notice::Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          else
            echo "::error::Coverage report not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-integration/
          retention-days: 7

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$v" || { echo "::error::Cargo.toml has no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # The advertised minimum must actually build the advertised default
      # feature set. Anything less is a number in a README, not an MSRV.
      - name: Build on the minimum supported toolchain
        run: cargo check --locked --all-targets

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check bans
        run: cargo deny check bans

      - name: Check advisories
        run: cargo deny check advisories

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --no-run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: stateset-sequencer
          path: target/release/stateset-sequencer
          if-no-files-found: error

  load-smoke:
    name: Release-binary Load Smoke
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequencer
          POSTGRES_PASSWORD: sequencer
          POSTGRES_DB: stateset_sequencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequencer -d stateset_sequencer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: stateset-sequencer
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install signed VES load client
        run: npm ci --prefix cli

      - name: Refuse unsigned VES receipts in production
        run: |
          chmod +x dist/stateset-sequencer
          if SEQUENCER_ENV=production dist/stateset-sequencer > production-signing-check.log 2>&1; then
            echo "Production started without a receipt signing key" >&2
            exit 1
          fi
          grep -q 'VES_SEQUENCER_SIGNING_KEY is required in production' production-signing-check.log

      - name: Start the release binary
        env:
          DATABASE_URL: postgres://sequencer:sequencer@127.0.0.1:5432/stateset_sequencer
          ALLOW_INSECURE_LOCAL_DB: "true"
          AUTH_MODE: disabled
          ALLOW_AUTH_DISABLED: "true"
          PAYLOAD_ENCRYPTION_MODE: disabled
          REQUIRE_SIGNED_EXECUTION_CONTROLS: "true"
          # Public fixture seed only; never use this key outside disposable CI.
          VES_SEQUENCER_SIGNING_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
          SEQUENCER_ENV: test
          RUST_LOG: info
        run: |
          chmod +x dist/stateset-sequencer
          dist/stateset-sequencer > sequencer-load-smoke.log 2>&1 &
          echo "$!" > sequencer-load-smoke.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat sequencer-load-smoke.log
          exit 1

      - name: Run thresholded ingest load test
        env:
          SEQUENCER_BASE_URL: http://127.0.0.1:8080
          API_KEY: ci-auth-disabled
          TENANT_ID: 10000000-0000-4000-8000-000000000001
          STORE_ID: 20000000-0000-4000-8000-000000000002
          AGENT_ID: 30000000-0000-4000-8000-000000000003
        run: |
          mkdir -p load/results
          chmod 0777 load/results
          docker run --rm --network host \
            -e SEQUENCER_BASE_URL -e API_KEY -e TENANT_ID -e STORE_ID -e AGENT_ID \
            -v "$PWD:/work" -w /work \
            grafana/k6:0.54.0 run \
            --config load/profiles/ci.json \
            --summary-export load/results/load-smoke-summary.json \
            load/sequencer_ingest.js

      - name: Check signed VES ingest and receipt load
        env:
          SEQUENCER_BASE_URL: http://127.0.0.1:8080
          API_KEY: ci-auth-disabled
          VES_RECEIPT_PUBLIC_KEY: d04ab232742bb4ab3a1368bd4615e4e6d0224ab71a016baf8520a332c9778737
          VES_LOAD_SUMMARY: load/results/ves-signed-load-summary.json
        run: node cli/bench/ves-signed-load.mjs

      - name: Stop release binary
        if: always()
        run: |
          if [ -f sequencer-load-smoke.pid ]; then
            kill "$(cat sequencer-load-smoke.pid)" || true
          fi

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-smoke-evidence
          path: |
            load/results/load-smoke-summary.json
            load/results/ves-signed-load-summary.json
            production-signing-check.log
            sequencer-load-smoke.log
          if-no-files-found: warn

  # Docker image build and push
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    # Never publish an image from a revision that has only passed a subset of
    # the required checks. `all-checks` includes both feature sets, MSRV,
    # coverage, supply-chain checks, and the release build.
    needs: [all-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # tonic-build compiles the gRPC protos at build time and needs protoc,
      # which the hosted runners do not ship.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}

      # The Dockerfile addresses the sequencer as stateset-sequencer/... (the
      # STARK crates are pinned git dependencies, so no STARK checkout is
      # staged). Stage that layout explicitly inside the workspace: the action
      # resolved the previous `context: ..` inconsistently and failed with
      # "lstat stateset-sequencer: no such file or directory".
      - name: Stage Docker build context
        run: |
          mkdir -p docker-ctx/stateset-sequencer
          rsync -a --exclude target --exclude .git --exclude docker-ctx ./ docker-ctx/stateset-sequencer/

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          file: docker-ctx/stateset-sequencer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # All checks must pass
  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [formal, node-sdk, python-sdk, lint, test, test-stark, msrv, coverage, security, license-check, benchmark, build, load-smoke]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.formal.result }}" != "success" ]]; then
            echo "Formal models failed"
            exit 1
          fi
          if [[ "${{ needs.node-sdk.result }}" != "success" ]]; then
            echo "Node SDK failed"
            exit 1
          fi
          if [[ "${{ needs.python-sdk.result }}" != "success" ]]; then
            echo "Python SDK failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test failed"
            exit 1
          fi
          if [[ "${{ needs.test-stark.result }}" != "success" ]]; then
            echo "Test (stark feature) failed"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "MSRV build failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security audit failed"
            exit 1
          fi
          if [[ "${{ needs.license-check.result }}" != "success" ]]; then
            echo "License check failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed"
            exit 1
          fi
          if [[ "${{ needs.benchmark.result }}" != "success" ]]; then
            echo "Benchmarks failed"
            exit 1
          fi
          if [[ "${{ needs.load-smoke.result }}" != "success" ]]; then
            echo "Release-binary load smoke failed"
            exit 1
          fi
          echo "All checks passed!"
