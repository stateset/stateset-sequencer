[package]
name = "stateset-sequencer"
version = "0.8.6"
edition = "2021"
rust-version = "1.90"
authors = ["StateSet Core Infrastructure"]
description = "Verifiable Event Sync (VES) sequencer for deterministic event ordering and state projection"
license = "MIT"
repository = "https://github.com/stateset/stateset-sequencer"

[features]
default = ["full"]
full = ["pqc", "stark"]

# Only features that actually gate code are declared here.
#
# `grpc`, `telemetry`, `anchoring`, `schema-validation`, `sqlite` and
# `encryption` used to be listed as toggles, but each was an empty feature that
# gated nothing: tonic/prost, the OpenTelemetry stack, alloy, jsonschema and the
# sqlx sqlite driver are all unconditional dependencies, and the corresponding
# modules compile unconditionally. Passing `--no-default-features --features
# grpc` therefore built the exact same binary as a default build, while
# implying the opposite. They are removed rather than kept as no-ops: a feature
# that silently does nothing is worse than an absent one, because it lets a
# build be described as "without gRPC" when gRPC is still compiled in and
# served. Reintroduce them only alongside the `#[cfg(feature = ...)]` gates and
# `optional = true` dependencies that would make them real.

# STARK proof verification endpoints (depends on the private stateset-stark
# workspace via the ves-stark-* crates). Disable to build/test the core
# sequencer without that dependency.
stark = [
    "dep:ves-stark-verifier",
    "dep:ves-stark-primitives",
    "dep:ves-stark-batch",
    "dep:ves-stark-prover",
]

# Post-quantum cryptography (ML-DSA-65, ML-KEM-768).
pqc = ["dep:ml-kem", "dep:ml-dsa", "dep:zeroize", "dep:subtle", "dep:hkdf"]

# Gates test-only modules that need a live database or external service.
integration = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC framework
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Database access
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"  # RFC 8785 JSON Canonicalization Scheme
serde_repr = "0.1"

# JSON Schema validation.
# default-features disabled: we only compile/validate in-memory schemas (no
# remote `$ref` over HTTP or file resolution), so `resolve-http`/`resolve-file`
# — and the `reqwest` dependency they pull — are not needed.
jsonschema = { version = "0.26", default-features = false }

# Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
rs_merkle = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
hpke = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-dsa = { version = "0.1.0-rc.8", features = ["zeroize"], optional = true }
ml-kem = { version = "0.3.0-rc.1", features = ["zeroize"], optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
subtle = { version = "2", optional = true }
hkdf = { version = "0.12", optional = true }

# Authentication
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"

# UUID and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry observability
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics", "trace", "grpc-tonic"] }
tracing-opentelemetry = "0.33"

# Configuration
config = "0.14"

# HTTP/REST (optional, alongside gRPC)
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "timeout", "trace"] }

# Hex encoding for hashes
hex = "0.4"

# StateSet STARK (Winterfell) verification.
# Optional + behind the `stark` feature: these crates live in the separate,
# private `stateset-stark` workspace, so gating them lets the core sequencer
# build and be tested (e.g. in CI) without that dependency. `ves-stark-prover`
# is only used by tests but is declared here (not in dev-dependencies, which
# cannot be optional) so `cargo test` without the `stark` feature does not pull
# the private repo.
ves-stark-verifier = { path = "../stateset-stark/crates/ves-stark-verifier", optional = true }
ves-stark-primitives = { path = "../stateset-stark/crates/ves-stark-primitives", optional = true }
ves-stark-batch = { path = "../stateset-stark/crates/ves-stark-batch", optional = true }
ves-stark-prover = { path = "../stateset-stark/crates/ves-stark-prover", optional = true }

# Ethereum/EVM interaction
# Explicit feature set (not "full") so the HTTP transport uses rustls instead of
# reqwest's default native-tls, which pulls `openssl` (banned by deny.toml in
# favor of rustls). Only the providers/HTTP-transport/signer/sol surface that
# anchor.rs actually uses is enabled.
alloy = { version = "1.6", default-features = false, features = [
    "contract",
    "network",
    "providers",
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types",
    "signer-local",
    "sol-types",
] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
# For on-chain integration tests (settlement send-path against a local EVM).
alloy = { version = "1.6", default-features = false, features = [
    "contract",
    "network",
    "providers",
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types",
    "signer-local",
    "sol-types",
] }
tempfile = "3"
serial_test = "3.5"
fake = { version = "2", features = ["derive", "uuid", "chrono"] }
proptest = "1"
http-body-util = "0.1"
mockall = "0.13"
criterion = { version = "0.5", features = ["async_tokio"] }

[lib]
name = "stateset_sequencer"
path = "src/lib.rs"

[[bin]]
name = "stateset-sequencer"
path = "src/main.rs"

[[bin]]
name = "stateset-sequencer-admin"
path = "src/bin/admin.rs"

[profile.release]
lto = true
codegen-units = 1
# Monetary amounts and sequence counters must never wrap silently, even if a
# defensive checked operation is accidentally omitted on a future code path.
overflow-checks = true

[profile.bench]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

[profile.bench.package.ves-stark-batch]
opt-level = 0

[profile.bench.package.ves-stark-prover]
opt-level = 0

[profile.bench.package.ves-stark-verifier]
opt-level = 0

[profile.bench.package.ves-stark-air]
opt-level = 0

[profile.bench.package.ves-stark-primitives]
opt-level = 0

[profile.bench.package.winter-prover]
opt-level = 0

[profile.bench.package.winter-math]
opt-level = 0

[profile.bench.package.winter-air]
opt-level = 0

[profile.bench.package.winter-crypto]
opt-level = 0

[profile.bench.package.winter-verifier]
opt-level = 0

[[bench]]
name = "sequencer_bench"
harness = false
