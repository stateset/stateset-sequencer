groups:
  - name: stateset-sequencer.slo
    rules:
      - alert: SequencerHighErrorRate
        expr: |
          (
            sum(rate(sequencer_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(sequencer_http_requests_total[5m]))
          ) > 0.001
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Sequencer 5xx error rate > 0.1% (10m)"
          description: "Investigate upstream dependencies, DB health, or deployment regressions."

      - alert: SequencerHighLatencyP95Ingest
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(sequencer_http_request_latency_seconds_bucket{path="/api/v1/ves/events/ingest"}[5m])) by (le)
          ) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Sequencer ingest p95 latency > 50ms (10m)"
          description: "Check DB saturation, payload sizes, or hot tenants."

      - alert: SequencerHighLatencyP95Read
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(sequencer_http_request_latency_seconds_bucket{path="/api/v1/events"}[5m])) by (le)
          ) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Sequencer read p95 latency > 50ms (10m)"
          description: "Check DB indexes, connection pool pressure, or cache hit rates."

  - name: stateset-sequencer.resources
    rules:
      - alert: SequencerDbPoolSaturation
        expr: sequencer_pool_utilization > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sequencer DB pool utilization > 90% (5m)"
          description: "Consider increasing pool size or optimizing queries."

      - alert: SequencerDbAcquireTimeouts
        expr: rate(sequencer_pool_timed_out_acquisitions[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Sequencer DB acquisition timeouts detected"
          description: "Pool contention or database saturation is causing timeouts."

  # ---------------------------------------------------------------------------
  # Scrape health. /metrics was silently unparseable for every real deployment
  # until v0.3.1 and nothing noticed, because the absence of series looked like
  # a healthy quiet service. These rules make "no data" itself an alert.
  # ---------------------------------------------------------------------------
  - name: stateset-sequencer.scrape
    rules:
      - alert: SequencerScrapeDown
        expr: up{job="stateset-sequencer"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the sequencer (3m)"
          description: >-
            Either the target is down or /metrics returned an unparseable
            exposition (a single malformed line fails the whole scrape).
            Check `curl -s $SEQ/metrics | promtool check metrics` before assuming
            the service itself is unhealthy.

      - alert: SequencerScrapeSeriesMissing
        expr: absent_over_time(sequencer_uptime_seconds{job="stateset-sequencer"}[10m])
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "No sequencer metrics received for 10m"
          description: >-
            The scrape may be succeeding at the transport level while the body
            is rejected, or the job label changed. Treat as an outage of
            observability, not as a quiet service.

      - alert: SequencerMetricsCardinalityOverflow
        expr: increase(sequencer_metrics_cardinality_overflow[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Sequencer dropped label sets due to the cardinality cap"
          description: >-
            Some series are being folded into the overflow bucket, so per-route
            metrics are degraded. Look for a label with unbounded values.
