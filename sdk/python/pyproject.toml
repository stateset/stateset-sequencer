[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "stateset-sequencer-sdk"
version = "0.8.4"
description = "Agent-native Python SDK for StateSet Sequencer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "StateSet" }]
keywords = ["ai-agents", "ves", "stateset", "sequencer", "ed25519"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "rfc8785>=0.1.4,<0.2",
  "typing-extensions>=4.12,<5; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "setuptools>=77,<82",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/stateset/stateset-sequencer"
Documentation = "https://github.com/stateset/stateset-sequencer/tree/master/sdk/python"
Issues = "https://github.com/stateset/stateset-sequencer/issues"
Source = "https://github.com/stateset/stateset-sequencer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stateset_sequencer = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["stateset_sequencer"]
